/* =========================================================
   第 2 部分：主题色 / 卡片外观
   改完背景想微调卡片，就改这里的值。
   ========================================================= */
:root {
  /* 卡片 */
  --card-bg: rgba(255, 255, 255, 0.84);
  --card-bg-strong: rgba(255, 255, 255, 0.92);
  --card-border: rgba(255, 255, 255, 0.95);
  --card-shadow: 0 10px 30px rgba(78, 122, 140, 0.13);
  --card-shadow-hover: 0 16px 40px rgba(78, 122, 140, 0.2);
  --radius-card: 26px;
  --radius-small: 16px;

  /* 文字 */
  --text: #26313a;
  --text-muted: #5d6b76;
  --text-faint: #8b98a3;

  /* 强调色（参考站里"写文章"按钮、日历今天的方块都是这个青绿色） */
  --accent: #2fbfa8;
  --accent-soft: rgba(47, 191, 168, 0.16);
  --accent-text: #ffffff;

  /* 时钟卡片的配色（深底浅字） */
  --clock-bg: rgba(38, 45, 56, 0.88);
  --clock-text: #e8f6f2;

  /* 布局 */
  --page-max: 1240px;
  --col-left: 274px;
  --col-right: 306px;
  --gap: 18px;
}

/* 暗色主题（右上角按钮切换）：遮罩换成深色，压住背景图 */
html[data-theme="dark"] {
  --bg-base: #0f141b;
  --bg-scrim: rgba(10, 14, 20, 0.64);
  --bg-blob-1: rgba(24, 92, 84, 0.75);
  --bg-blob-2: rgba(30, 58, 104, 0.7);
  --bg-blob-3: rgba(96, 40, 74, 0.7);
  --bg-blob-4: rgba(56, 40, 96, 0.7);

  --card-bg: rgba(28, 36, 46, 0.8);
  --card-bg-strong: rgba(30, 39, 50, 0.94);
  --card-border: rgba(255, 255, 255, 0.08);
  --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --card-shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.45);

  --text: #e7eaf0;
  --text-muted: #9aa7b4;
  --text-faint: #7b8896;

  --accent: #3ed0b6;
  --accent-soft: rgba(62, 208, 182, 0.16);

  --clock-bg: rgba(12, 16, 22, 0.9);
  --clock-text: #d8f6ef;
}


/* =========================================================
   第 3 部分：基础样式
   ========================================================= */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  transition: color 0.35s ease;

  /* 背景：底色 + 背景图（含遮罩）+ 光晕 */
  background-color: var(--bg-base);
  background-image: var(--bg-image),
    radial-gradient(circle at 8% 12%, var(--bg-blob-1) 0%, transparent 45%),
    radial-gradient(circle at 92% 6%, var(--bg-blob-2) 0%, transparent 42%),
    radial-gradient(circle at 88% 92%, var(--bg-blob-3) 0%, transparent 45%),
    radial-gradient(circle at 6% 88%, var(--bg-blob-4) 0%, transparent 45%);
  background-attachment: var(--bg-attachment);
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  transition: background-color 0.35s ease, color 0.35s ease;
}

img {
  max-width: 100%;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

::selection {
  background: var(--accent);
  color: #fff;
}

/* 全屏背景图层（默认全透明，保留给以后做背景图轮换用） */
.site-background {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 0.9s ease;
  pointer-events: none;
}


/* =========================================================
   第 4 部分：页面骨架 + 三列布局
   ---------------------------------------------------------
   首页是"三列"：左列 profile，中列 main，右列 side。
   想把某张卡片从一列挪到另一列？在 index.html 里把那个
   <section> 整块剪切到另一个 <div class="col"> 里就行，
   顺序就是上下的顺序。
   ========================================================= */
.page {
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 28px 22px 48px;
}

.bento {
  display: grid;
  grid-template-columns: var(--col-left) minmax(0, 1fr) var(--col-right);
  gap: var(--gap);
  align-items: start;
}

.col {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  min-width: 0;
}

/* 右上角悬浮的主题切换按钮 */
.theme-fab {
  position: fixed;
  top: 18px;
  right: 20px;
  z-index: 50;
  width: 42px;
  height: 42px;
  border: 1px solid var(--card-border);
  border-radius: 50%;
  background: var(--card-bg-strong);
  box-shadow: var(--card-shadow);
  font-size: 18px;
  line-height: 1;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.theme-fab:hover {
  transform: translateY(-2px);
  box-shadow: var(--card-shadow-hover);
}

/* 子页面用两列：左导航 + 右内容（在页面里给 .bento 加上 is-two-col） */
.bento.is-two-col {
  grid-template-columns: var(--col-left) minmax(0, 1fr);
}

/* 页脚 */
.footer {
  margin-top: 30px;
  text-align: center;
  color: var(--text-faint);
  font-size: 12.5px;
}

.footer p {
  margin: 0;
}


/* =========================================================
   第 5 部分：卡片通用外观
   所有卡片都带 .card。想统一改圆角/阴影，改第 2 部分的变量。
   ========================================================= */
.card {
  position: relative;
  padding: 20px;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-card);
  background: var(--card-bg);
  box-shadow: var(--card-shadow);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: transform 0.25s ease, box-shadow 0.25s ease,
    background-color 0.35s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--card-shadow-hover);
}

/* 卡片里的小标题，例如"最新文章""随机推荐" */
.card-label {
  margin: 0 0 12px;
  color: var(--text-muted);
  font-size: 12.5px;
  letter-spacing: 0.06em;
}


/* =========================================================
   第 6 部分：各个卡片
   ========================================================= */

/* ---------- 6.1 个人卡（头像 + 名字 + 导航菜单） ---------- */
.card-profile {
  padding: 22px 18px;
}

.profile-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  border-radius: 14px;
  transition: background-color 0.2s ease;
}

.profile-head:hover {
  background: var(--accent-soft);
}

.profile-avatar {
  width: 54px;
  height: 54px;
  flex: none;
  border-radius: 50%;
  object-fit: cover;
  background: var(--accent-soft);
  box-shadow: 0 0 0 3px var(--card-bg-strong);
}

.profile-name {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.3;
}

.profile-status {
  color: var(--text-faint);
  font-size: 12px;
  font-weight: 400;
}

.profile-sub {
  margin: 0 0 10px;
  color: var(--text-muted);
  font-size: 12.5px;
  letter-spacing: 0.06em;
}

/* 导航菜单（近期文章 / 我的项目 / …） */
.nav-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 14px;
  border-radius: 14px;
  color: var(--text-muted);
  font-size: 14.5px;
  transition: background-color 0.2s ease, color 0.2s ease;
}

.nav-item:hover {
  background: var(--accent-soft);
  color: var(--text);
}

/* 当前所在页面高亮 */
.nav-item.is-active {
  background: var(--card-bg-strong);
  color: var(--accent);
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(78, 122, 140, 0.12);
}

.nav-icon {
  width: 20px;
  flex: none;
  text-align: center;
  font-size: 15px;
}

/* ---------- 6.2 贴纸装饰卡 ---------- */
.card-stickers {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 16px;
}

.polaroid {
  width: 88px;
  height: 98px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 4px solid #fff;
  background: linear-gradient(150deg, #ffe6f1, #dff5ec 60%, #e6ecff);
  box-shadow: 0 6px 18px rgba(78, 122, 140, 0.16);
  font-size: 34px;
  transition: transform 0.25s ease;
}

.polaroid:nth-child(1) {
  transform: rotate(-7deg) translateY(4px);
}
.polaroid:nth-child(2) {
  transform: rotate(3deg) translateY(-4px);
}
.polaroid:nth-child(3) {
  transform: rotate(8deg) translateY(5px);
}

.card-stickers:hover .polaroid:nth-child(1) {
  transform: rotate(-10deg) translateY(0);
}
.card-stickers:hover .polaroid:nth-child(2) {
  transform: rotate(0deg) translateY(-8px);
}
.card-stickers:hover .polaroid:nth-child(3) {
  transform: rotate(11deg) translateY(1px);
}

/* ---------- 6.3 问候卡（含吉祥物 / live2d 位置） ---------- */
.card-greeting {
  padding: 26px 20px 30px;
  text-align: center;
}

.mascot {
  width: 108px;
  height: 108px;
  margin: 0 auto 14px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, #fff6c9, #ffe9a8);
  font-size: 50px;
  box-shadow: 0 8px 22px rgba(214, 190, 90, 0.28);
}

.greeting-text {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.7;
}

.greeting-text .hi {
  color: var(--accent);
}

/* ---------- 6.4 写文章按钮 ---------- */
.card-write {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 15px 20px;
  border-radius: 18px;
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
  box-shadow: 0 10px 24px rgba(47, 191, 168, 0.32);
}

.card-write:hover {
  transform: translateY(-3px);
  filter: brightness(1.05);
}

/* ---------- 6.5 数字时钟 ---------- */
.card-clock {
  padding: 18px 20px;
  background: var(--clock-bg);
  border-color: transparent;
  text-align: center;
}

.clock-time {
  color: var(--clock-text);
  font-family: ui-monospace, "Cascadia Mono", "Consolas", "SFMono-Regular",
    monospace;
  font-size: 42px;
  font-weight: 600;
  letter-spacing: 0.1em;
  line-height: 1.1;
  text-shadow: 0 0 16px rgba(120, 240, 210, 0.35);
}

.clock-date {
  margin-top: 4px;
  color: rgba(232, 246, 242, 0.6);
  font-size: 12px;
  letter-spacing: 0.1em;
}

/* ---------- 6.6 日历 ---------- */
.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.cal-today {
  font-size: 13.5px;
  color: var(--text-muted);
}

.cal-nav {
  display: flex;
  gap: 6px;
}

.cal-btn {
  width: 26px;
  height: 26px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 13px;
  line-height: 1;
}

.cal-btn:hover {
  filter: brightness(1.05);
  transform: translateY(-1px);
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  text-align: center;
}

.cal-weekday {
  padding-bottom: 4px;
  color: var(--text-faint);
  font-size: 11.5px;
}

.cal-day {
  padding: 6px 0;
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--text-muted);
}

.cal-day.is-today {
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(47, 191, 168, 0.35);
}

.cal-day.is-empty {
  visibility: hidden;
}

/* ---------- 6.7 文章 / 推荐 小卡片（带缩略图） ---------- */
.thumb-row {
  display: flex;
  gap: 13px;
  align-items: flex-start;
}

.thumb {
  width: 56px;
  height: 56px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: linear-gradient(140deg, #dff5ec, #e6ecff 70%, #ffe6f1);
  font-size: 24px;
  overflow: hidden;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.thumb-title {
  margin: 0 0 4px;
  font-size: 14.5px;
  font-weight: 600;
  line-height: 1.45;
}

.thumb-desc {
  margin: 0;
  color: var(--text-muted);
  font-size: 12.5px;
  line-height: 1.6;
}

.thumb-meta {
  margin-top: 6px;
  color: var(--text-faint);
  font-size: 11.5px;
}

.thumb-row:hover .thumb-title {
  color: var(--accent);
}

/* ---------- 6.8 社交按钮排 ---------- */
.social-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.social-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 15px;
  border-radius: 12px;
  background: #24292e;
  color: #fff;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: 0 6px 16px rgba(36, 41, 46, 0.22);
  transition: transform 0.2s ease, filter 0.2s ease;
}

.social-btn:hover {
  transform: translateY(-3px);
  filter: brightness(1.1);
}

.social-btn svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.social-btn.is-bilibili {
  background: #fb7299;
  box-shadow: 0 6px 16px rgba(251, 114, 153, 0.3);
}

.social-btn.is-xhs {
  background: #ff2442;
  box-shadow: 0 6px 16px rgba(255, 36, 66, 0.28);
}

.social-btn.is-csdn {
  background: #fc5531;
  box-shadow: 0 6px 16px rgba(252, 85, 49, 0.3);
}

.social-btn.is-mail {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  box-shadow: none;
}

/* ---------- 6.9 音乐播放器 ---------- */
.card-music {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
}

.music-note {
  font-size: 18px;
  color: var(--accent);
}

.music-body {
  flex: 1;
  min-width: 0;
}

.music-title {
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.music-bar {
  height: 4px;
  margin-top: 7px;
  border-radius: 999px;
  background: var(--accent-soft);
  overflow: hidden;
}

.music-bar span {
  display: block;
  width: 0;
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
  transition: width 0.25s linear;
}

.music-play {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 13px;
}

.music-hint {
  margin-top: 5px;
  color: var(--text-faint);
  font-size: 11px;
}

/* ---------- 6.10 点赞 / 计数 ---------- */
.card-like {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--card-border);
  border-radius: 999px;
  background: var(--card-bg);
  box-shadow: var(--card-shadow);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  font-size: 13.5px;
  color: var(--text-muted);
  transition: transform 0.2s ease;
}

.card-like:hover {
  transform: translateY(-3px);
}

.card-like.is-liked {
  color: #ff5f8a;
}

.like-heart {
  font-size: 16px;
  transition: transform 0.2s ease;
}

.card-like.is-liked .like-heart {
  transform: scale(1.2);
}


/* =========================================================
   第 7 部分：子页面（文章 / 项目 / 关于 / 分享 / 博客）
   ========================================================= */
.page-head {
  margin: 2px 0 20px;
}

.page-title {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.page-desc {
  margin: 0;
  color: var(--text-muted);
  font-size: 14px;
}

.list-stack {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

.card-list-item {
  display: block;
}

/* 文章正文（关于页面用） */
.prose {
  max-width: 68ch;
}

.prose h2 {
  margin: 26px 0 10px;
  font-size: 18px;
}

.prose p {
  margin: 0 0 13px;
  color: var(--text-muted);
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.tag {
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11.5px;
  font-weight: 600;
}


/* =========================================================
   第 8 部分：响应式
   ========================================================= */
@media (max-width: 1080px) {
  .bento {
    grid-template-columns: var(--col-left) minmax(0, 1fr);
  }

  /* 右列挪到下面，变成整行 */
  .col-right {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    align-items: start;
  }
}

@media (max-width: 720px) {
  .page {
    padding: 16px 14px 34px;
  }

  .bento {
    grid-template-columns: 1fr;
  }

  .col-right {
    display: flex;
  }

  .clock-time {
    font-size: 36px;
  }

  .theme-fab {
    top: 12px;
    right: 12px;
    width: 38px;
    height: 38px;
  }
}


/* =========================================================
   第 9 部分：尊重系统的"减少动效"设置
   ========================================================= */
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

  <!-- ===== 脚本（放在 head 里，为了在渲染前就应用主题，避免闪烁）===== -->
  <script>
/* =========================================================
   个人网站 · 主脚本
   数据在 assets/js/data.js，这里负责把数据渲染成页面，
   以及主题切换、时钟、日历、音乐播放器、点赞这些交互。
   ========================================================= */


/* =========================================================
   第 1 部分：立即执行（防止主题闪烁）
   ========================================================= */
(function () {
  try {
    var savedTheme = localStorage.getItem("site-theme");
    if (savedTheme === "light" || savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }
  } catch (error) {
    /* 隐私模式下 localStorage 不可用，忽略 */
  }
})();

// 头像加载失败时的兜底图。
// 被 HTML 的 onerror="handleAvatarError(this)" 调用，所以必须写成全局函数。
function handleAvatarError(img) {
  img.onerror = null;
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
    '<rect width="200" height="200" fill="#dff5ec"/>' +
    '<circle cx="100" cy="78" r="34" fill="#2fbfa8"/>' +
    '<path d="M28 192c0-40 32-64 72-64s72 24 72 64z" fill="#2fbfa8"/>' +
    "</svg>";
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}


/* 页面里的 #siteBackground 是一层空的全屏图层，留给以后做背景图轮换用。 */


var SiteCore = (function () {
  "use strict";

  /* =======================================================
     第 3 部分：数据层
     ======================================================= */
  var DATA_KEY = "site-data";
  var DEFAULT_DATA = typeof SITE !== "undefined" && SITE ? SITE : {};
  var DATA = {};

  function isPlainObject(value) {
    return !!value && typeof value === "object" && !Array.isArray(value);
  }

  // 深度合并：对象递归合并，数组和普通值直接用"覆盖"的那份。
  // 数组整体替换，所以删掉一条记录能记住。
  function deepMerge(base, override) {
    if (override === undefined) return base;
    if (!isPlainObject(base) || !isPlainObject(override)) return override;
    var out = {};
    Object.keys(base).forEach(function (key) {
      out[key] = base[key];
    });
    Object.keys(override).forEach(function (key) {
      out[key] = deepMerge(base[key], override[key]);
    });
    return out;
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function getByPath(obj, path) {
    if (!path) return undefined;
    var parts = String(path).split(".");
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  function setByPath(obj, path, value) {
    var parts = String(path).split(".");
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      var key = parts[i];
      if (cur[key] == null) {
        cur[key] = /^\d+$/.test(parts[i + 1]) ? [] : {};
      }
      cur = cur[key];
    }
    cur[parts[parts.length - 1]] = value;
  }

  function load() {
    var saved = null;
    
    DATA = deepMerge(DEFAULT_DATA, saved || {});
    cleanLegacyJunk();
  }

  // 早期版本有个 bug：编辑缩略图 emoji 时会往条目里写进 posts.0.0 这种多余的键。
  // 这里把列表条目里那些"纯数字的键"删掉，免得它们一直跟着数据跑。
  function cleanLegacyJunk() {
    var lists = ["posts", "projects", "shares", "bloggers"];
    lists.forEach(function (name) {
      var list = DATA[name];
      if (!Array.isArray(list)) return;
      list.forEach(function (item) {
        if (!item || typeof item !== "object") return;
        Object.keys(item).forEach(function (key) {
          if (/^\d+$/.test(key)) delete item[key];
        });
      });
    });
  }

  function save() {
    try {
      localStorage.setItem(DATA_KEY, JSON.stringify(DATA));
      return true;
    } catch (error) {
      return false;
    }
  }

  function clearSaved() {
    try {
      localStorage.removeItem(DATA_KEY);
    } catch (error) {
      /* 忽略 */
    }
  }

  function hasSaved() {
    try {
      return !!localStorage.getItem(DATA_KEY);
    } catch (error) {
      return false;
    }
  }

  // 是不是"本地打开"：双击 html 文件（file://）或 localhost。
  // 编辑按钮只在本地出现，发布到网上后访客看不到。
  function isLocal() {
    try {
      if (location.protocol === "file:") return true;
      var host = location.hostname;
      return host === "localhost" || host === "127.0.0.1" || host === "::1";
    } catch (error) {
      return false;
    }
  }

  /* =======================================================
     第 4 部分：渲染层
     ======================================================= */

  function esc(text) {
    return String(text == null ? "" : text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // 生成 data-path 标记（记录这段文字对应数据里的哪一项）
  function pathAttr(path) {
    return path ? ' data-path="' + path + '"' : "";
  }

  // 判断 cover 是不是一个"真的图片路径"。像 "。" 这种当成没填。
  function isRealCover(cover) {
    if (!cover) return false;
    return /^(https?:|data:|assets\/|\.\/|\/|[A-Za-z]:)/.test(String(cover).trim());
  }

  function thumbHTML(item, base) {
    if (isRealCover(item.cover)) {
      return (
        '<div class="thumb"><img src="' +
        esc(item.cover) +
        '" alt="" onerror="this.remove()"></div>'
      );
    }
    return (
      '<div class="thumb"' +
      pathAttr(base + ".emoji") +
      ">" +
      esc(item.emoji || "📄") +
      "</div>"
    );
  }

  // 一张"带缩略图的条目卡"
  // asCard = true 时外面套一层可点击的 <a class="card card-list-item">
  function itemCardHTML(listKey, index, item, asCard) {
    var base = listKey + "." + index;

    var metaParts = [];
    if (item.date) {
      metaParts.push(
        '<span' + pathAttr(base + ".date") + ">" + esc(item.date) + "</span>"
      );
    }
    if (item.views) metaParts.push("<span>浏览量：" + esc(item.views) + "</span>");
    if (item.marks) metaParts.push("<span>标记：" + esc(item.marks) + "</span>");

    // 标签只做展示，内容来自 data.js 里的 tags
    var tagsHTML = "";
    if (item.tags && item.tags.length) {
      tagsHTML =
        '<div class="tags">' +
        item.tags
          .map(function (tag) {
            return '<span class="tag">' + esc(tag) + "</span>";
          })
          .join("") +
        "</div>";
    }

    var body =
      '<div class="thumb-row">' +
      thumbHTML(item, base) +
      "<div>" +
      '<p class="thumb-title"' +
      pathAttr(base + ".title") +
      ">" +
      esc(item.title) +
      "</p>" +
      '<p class="thumb-desc"' +
      pathAttr(base + ".excerpt") +
      ">" +
      esc(item.excerpt || "") +
      "</p>" +
      (metaParts.length
        ? '<div class="thumb-meta">' + metaParts.join(" · ") + "</div>"
        : "") +
      "</div>" +
      "</div>" +
      tagsHTML;

    if (asCard) {
      return (
        '<a class="card card-list-item" href="' +
        esc(item.url || "#") +
        '" data-item="' +
        esc(base) +
        '">' +
        body +
        "</a>"
      );
    }
    return body;
  }

  /* ---------- 4.1 个人卡 ---------- */
  function renderProfile() {
    // 单文件版会把多个页面拼在一起，所以按属性找、逐个填充
    var cards = document.querySelectorAll("[data-profile-card]");
    if (!cards.length) return;

    var owner = DATA.owner || {};
    var nav = DATA.nav || [];
    var pageKey = (document.body.getAttribute("data-page") || "").trim();
    var hasMatch = nav.some(function (item) {
      return item.key === pageKey;
    });
    var activeKey = hasMatch ? pageKey : nav.length ? nav[0].key : "";

    var navHTML = nav
      .map(function (item, i) {
        return (
          '<a class="nav-item' +
          (item.key === activeKey ? " is-active" : "") +
          '" href="' +
          esc(item.href) +

          '<span class="nav-icon" aria-hidden="true"' +
          pathAttr("nav." + i + ".icon") +
          ">" +
          esc(item.icon || "•") +
          "</span>" +
          "<span" +
          pathAttr("nav." + i + ".label") +
          ">" +
          esc(item.label) +

          "</a>"

      '<h2 class="profile-name">' +
      '<span' +
      pathAttr("owner.name") +

      esc(owner.name || "你的名字") +

          ">" +
          esc(owner.status) +

      "</div>" +
      "</a>" +
      "</div>" +
      (owner.sectionLabel

          esc(owner.sectionLabel) +
          "</p>"

      '<nav class="nav-list" aria-label="站点导航">' +
      navHTML +
      "</nav>";

    Array.prototype.forEach.call(cards, function (el) {
      el.innerHTML = html;

  }

  /* ---------- 4.2 问候卡 ---------- */
  var TIME_SLOT = null; // 当前是 morning / afternoon / evening

  /* ---------- 4.3 社交按钮排 ---------- */
  var GITHUB_ICON =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>';

      ' preload="none"></audio>';

    var audio = document.getElementById("musicAudio");
    var playBtn = document.getElementById("musicPlay");
    var progress = document.getElementById("musicProgress");
    var hint = document.getElementById("musicHint");

    function showHint(text) {
      if (!hint) return;
      hint.textContent = text;
      hint.hidden = false;
    }

    audio.addEventListener("error", function () {
      showHint("还没有音乐文件：把 mp3 放进 assets/audio/ 再改一下音乐地址");
    });

    playBtn.addEventListener("click", function () {
      if (audio.paused) {
        var playing = audio.play();
        if (playing && playing.catch) {
          playing.catch(function () {
            showHint("浏览器没找到这个音频文件，检查一下地址");
          });
        }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", function () {
      playBtn.textContent = "❚❚";
      playBtn.setAttribute("aria-label", "暂停");
      if (hint) hint.hidden = true;
    });
    audio.addEventListener("pause", function () {
      playBtn.textContent = "▶";
      playBtn.setAttribute("aria-label", "播放");
    });
    audio.addEventListener("timeupdate", function () {
      if (!audio.duration) return;
      progress.style.width = (audio.currentTime / audio.duration) * 100 + "%";
    });
  }

  /* ---------- 4.5 点赞 ---------- */
  var likeState = { liked: false, extraVisits: 0, ready: false };

  function renderLike() {
    var btn = document.getElementById("likeCard");
    if (!btn) return;

    var cfg = DATA.like || { baseCount: 0, baseVisits: 0 };
    var likes = Number(cfg.baseCount || 0) + (likeState.liked ? 1 : 0);
    var visits = Number(cfg.baseVisits || 0) + likeState.extraVisits;

    btn.classList.toggle("is-liked", likeState.liked);
    btn.innerHTML =
      '<span class="like-heart" aria-hidden="true">' +
      (likeState.liked ? "❤️" : "🤍") +
      "</span><span>" +
      likes +
      " / " +
      visits +
      "</span>";
    btn.setAttribute("aria-label", likeState.liked ? "取消点赞" : "点赞这篇帖子");
  }

  function initLike() {
    var btn = document.getElementById("likeCard");
    if (!btn || likeState.ready) return;

    try {
      likeState.liked = localStorage.getItem("site-liked") === "1";
      likeState.extraVisits = Number(localStorage.getItem("site-visits") || 0);
      if (!sessionStorage.getItem("site-visit-counted")) {
        likeState.extraVisits += 1;
        localStorage.setItem("site-visits", String(likeState.extraVisits));
        sessionStorage.setItem("site-visit-counted", "1");
      }
    } catch (error) {
      /* 忽略 */
    }
    likeState.ready = true;

    btn.addEventListener("click", function () {
      likeState.liked = !likeState.liked;
      try {
        localStorage.setItem("site-liked", likeState.liked ? "1" : "0");
      } catch (error) {
        /* 忽略 */
      }
      renderLike();
    });
  }

  /* ---------- 4.6 首页的"最新文章" ---------- */
  function renderHomeCards() {
    var latest = document.getElementById("latestCard");
    var posts = DATA.posts || [];
    if (!latest || !posts.length) return;

    latest.innerHTML =
      '<p class="card-label">最新文章</p>' +
      itemCardHTML("posts", 0, posts[0], false);
  }

  /* ---------- 4.7 子页面标题 ---------- */
  function renderPages() {
    var key = (document.body.getAttribute("data-page") || "").trim();
    var pages = DATA.pages || {};
    var page = pages[key];
    if (!page) return;

    // 每个视图里都可能有一份标题，统一按当前页面的数据填
    var titles = document.querySelectorAll(".page-head .page-title");
    var descs = document.querySelectorAll(".page-head .page-desc");
    Array.prototype.forEach.call(titles, function (el) {
      el.innerHTML =
        "<span" + pathAttr("pages." + key + ".title") + ">" + esc(page.title || "") + "</span>";
    });
    Array.prototype.forEach.call(descs, function (el) {
      el.innerHTML =
        "<span" + pathAttr("pages." + key + ".desc") + ">" + esc(page.desc || "") + "</span>";
    });
  }

  /* ---------- 4.8 列表（文章 / 项目 / 推荐网址 / 优质资源） ---------- */
  function renderList(listKey) {
    var containers = document.querySelectorAll('[data-list="' + listKey + '"]');
    var items = DATA[listKey] || [];
    Array.prototype.forEach.call(containers, function (container) {
      if (!items.length) {
        container.innerHTML =
          '<p class="page-desc">这个列表还是空的，内容加在 data.js 里。</p>';
        return;
      }
      container.innerHTML = items
        .map(function (item, index) {
          return itemCardHTML(listKey, index, item, true);
        })
        .join("");
    });
  }

  function renderLists() {
    renderList("posts");
    renderList("projects");
    renderList("shares");
    renderList("bloggers");
  }

  /* ---------- 4.9 关于页面 ---------- */
  function renderAbout() {
    var a = DATA.about || {};

    function heading(title, path) {
      return "<h2" + pathAttr(path) + ">" + esc(title) + "</h2>";
    }

    // 段落列表：自我介绍 / 比赛经历 / 未来规划
    function paragraphs(list, basePath) {
      return (list || [])
        .map(function (text, i) {
          return "<p" + pathAttr(basePath + "." + i) + ">" + esc(text) + "</p>";
        })
        .join("");
    }

    var intro = document.getElementById("aboutIntro");
    if (intro) {
      intro.innerHTML =
        heading(a.introTitle || "关于我", "about.introTitle") +
        paragraphs(a.intro, "about.intro") +
        (a.contest && a.contest.length
          ? heading(a.contestTitle || "比赛经历", "about.contestTitle") +
            paragraphs(a.contest, "about.contest")
          : "") +
        (a.plan && a.plan.length
          ? heading(a.planTitle || "未来规划", "about.planTitle") +
            paragraphs(a.plan, "about.plan")
          : "") +
        heading(a.skillsTitle || "技能", "about.skillsTitle") +
        '<div class="tags" id="skillTags">' +
        (a.skills || [])
          .map(function (skill, i) {
            return '<span class="tag"' + pathAttr("about.skills." + i) + ">" + esc(skill) + "</span>";
          })
          .join("") +
        "</div>";
    }

    var site = document.getElementById("aboutSite");
    if (site) {
      site.innerHTML =
        heading(a.siteTitle || "这个网站是怎么做的", "about.siteTitle") +
        paragraphs(a.siteBody, "about.siteBody");
    }

    var contactLabel = document.getElementById("contactLabel");
    if (contactLabel) {
      contactLabel.innerHTML =
        "<span" + pathAttr("about.contactTitle") + ">" +
        esc(a.contactTitle || "联系我") +
        "</span>";
    }
  }

  /* ---------- 4.10 页脚 ---------- */
  function renderFooter() {
    var yearEl = document.getElementById("year");
    if (yearEl) yearEl.textContent = String(new Date().getFullYear());

    var nameEl = document.getElementById("footerName");
    if (nameEl) nameEl.textContent = (DATA.owner && DATA.owner.name) || "我";
  }

  function renderAll() {
    renderProfile();
    renderGreeting();
    renderSocial();
    renderMusic();
    renderLike();
    renderHomeCards();
    renderPages();
    renderLists();
    renderAbout();
    renderFooter();
  }

  /* =======================================================
     第 5 部分：交互层
     ======================================================= */

  /* ---------- 5.1 主题切换 ---------- */
  function initTheme() {
    var btn = document.getElementById("themeToggle");
    var root = document.documentElement;
    if (!btn) return;

    function current() {
      return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
    }

    function paint() {
      var isDark = current() === "dark";
      btn.textContent = isDark ? "☀️" : "🌙";
      var label = isDark ? "切换到浅色主题" : "切换到暗色主题";
      btn.setAttribute("aria-label", label);
      btn.setAttribute("title", label);
    }

    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try {
        localStorage.setItem("site-theme", next);
      } catch (error) {
        /* 忽略 */
      }
      paint();
    });

    paint();
  }

  /* ---------- 5.2 数字时钟 ---------- */
  function initClock() {
    var timeEl = document.getElementById("clockTime");
    var dateEl = document.getElementById("clockDate");
    if (!timeEl) return;

    function pad(n) {
      return n < 10 ? "0" + n : String(n);
    }

    function tick() {
      var d = new Date();
      timeEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
      if (dateEl) {
        dateEl.textContent = d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate());
      }
    }

    tick();
    setInterval(tick, 1000);
  }

  /* ---------- 5.3 日历 ---------- */
  function initCalendar() {
    var calendar = document.getElementById("calendar");
    if (!calendar) return;

    var WEEKDAYS = ["一", "二", "三", "四", "五", "六", "日"];
    var today = new Date();
    var viewYear = today.getFullYear();
    var viewMonth = today.getMonth();

    function paint() {
      var first = new Date(viewYear, viewMonth, 1);
      var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      var leading = (first.getDay() + 6) % 7; // 让周一排第一列

      var cells = "";
      for (var i = 0; i < leading; i++) cells += '<div class="cal-day is-empty"></div>';
      for (var day = 1; day <= daysInMonth; day++) {
        var isToday =
          viewYear === today.getFullYear() &&
          viewMonth === today.getMonth() &&
          day === today.getDate();
        cells += '<div class="cal-day' + (isToday ? " is-today" : "") + '">' + day + "</div>";
      }

      var head =
        '<div class="cal-head">' +
        '<div class="cal-today">' +
        viewYear + "/" + (viewMonth + 1) + "/" + today.getDate() +
        " 周" + WEEKDAYS[(today.getDay() + 6) % 7] +
        "</div>" +
        '<div class="cal-nav">' +
        '<button class="cal-btn" type="button" data-cal="-1" aria-label="上个月">‹</button>' +
        '<button class="cal-btn" type="button" data-cal="1" aria-label="下个月">›</button>' +
        "</div>" +
        "</div>";

      var weekRow = WEEKDAYS.map(function (w) {
        return '<div class="cal-weekday">' + w + "</div>";
      }).join("");

      calendar.innerHTML = head + '<div class="cal-grid">' + weekRow + cells + "</div>";
    }

    calendar.addEventListener("click", function (event) {
      var btn = event.target.closest("[data-cal]");
      if (!btn) return;
      viewMonth += Number(btn.getAttribute("data-cal"));
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear -= 1;
      } else if (viewMonth > 11) {
        viewMonth = 0;
        viewYear += 1;
      }
      paint();
    });

    paint();
  }

  /* ---------- 5.4 页面右下角的小提示条 ---------- */
  var toastTimer = null;

  function toast(message) {
    var el = document.getElementById("siteToast");
    if (!el) {
      el = document.createElement("div");
      el.id = "siteToast";
      el.className = "site-toast";
      document.body.appendChild(el);
    }
    el.textContent = message;
    el.classList.add("is-show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove("is-show");
    }, 3200);
  }

  /* =======================================================
     第 6 部分：启动
     ======================================================= */
  function boot() {
    load();
    renderAll();
    initTheme();
    initClock();
    initCalendar();
    initLike();
    renderLike();

    // data.js 一个键都没读到：说明文件没加载成功（多半是语法被改坏了）。
    // 这种情况页面会是空的，得明确提示一下，别让人对着空白页发呆。
    if (Object.keys(DEFAULT_DATA).length === 0) {
      toast("⚠️ data.js 没有正常加载，页面内容可能不完整。");
    }

  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  return {
    getData: function () {
      return DATA;
    },
    clone: clone,
    load: load,
    save: save,
    clearSaved: clearSaved,
    hasSaved: hasSaved,
    getByPath: getByPath,
    setByPath: setByPath,
    isLocal: isLocal,
    renderAll: renderAll,
    renderList: renderList,
    renderProfile: renderProfile,
    renderGreeting: renderGreeting,
    renderSocial: renderSocial,
    renderMusic: renderMusic,
    renderAbout: renderAbout,
    renderPages: renderPages,
    renderHomeCards: renderHomeCards,
    replaceAll: function (data) {
      DATA = data;
    },
    esc: esc,
    toast: toast
  };
})();

</script>
</head>

        <input id=&quot;nominal&quot; type=&quot;number&quot; min=&quot;0.1&quot; max=&quot;500&quot; step=&quot;0.1&quot; value=&quot;50&quot; />
      </label>
      <label class=&quot;field&quot;>公差等级
        <select id=&quot;grade&quot;></select>
      </label>
      <label class=&quot;field&quot;>基准件
        <select id=&quot;basis&quot;>
          <option value=&quot;H&quot;>孔 H（下偏差 = 0）</option>
          <option value=&quot;h&quot;>轴 h（上偏差 = 0）</option>
        </select>
      </label>
    </div>

    <div class=&quot;out&quot; id=&quot;singleOut&quot;></div>
  </div>

  <!-- 配合 -->
  <div class=&quot;card&quot;>
    <h2>二、算配合（间隙 / 过盈）</h2>
    <p class=&quot;hint&quot;>孔用 H、轴用 h 的基准制配合。给出这对孔轴的最大最小间隙，并判断配合性质。</p>

    <div class=&quot;grid&quot;>
      <label class=&quot;field&quot;>公称尺寸 D（mm）
        <input id=&quot;fitNominal&quot; type=&quot;number&quot; min=&quot;0.1&quot; max=&quot;500&quot; step=&quot;0.1&quot; value=&quot;50&quot; />
      </label>
      <label class=&quot;field&quot;>孔的公差等级
        <select id=&quot;fitHole&quot;></select>
      </label>
      <label class=&quot;field&quot;>轴的公差等级
        <select id=&quot;fitShaft&quot;></select>
      </label>
    </div>

    <div class=&quot;out&quot; id=&quot;fitOut&quot;></div>
  </div>

  <div class=&quot;card&quot;>
    <h2>说明</h2>
    <p class=&quot;note&quot;>
      公差值取自 GB/T 1800.1（ISO 286-1）标准公差数值表，尺寸分段按标准的 13 段划分。<br />
      本工具支持 <code>H</code> 孔 / <code>h</code> 轴两种基准件；其他基本偏差代号（f、g、k、n、p…）
      的极限偏差需另查标准表。<br />
      等级大致用途：IT5~IT6 量规、精密件 ｜ IT7~IT8 一般配合 ｜ IT9~IT11 一般机加工 ｜
      IT12~IT14 粗加工 ｜ IT15~IT18 非配合尺寸。
    </p>
  </div>

<script>
// 标准公差数值表（µm）：尺寸分段上限 → [IT5, IT6, ... IT18]
var IT_TABLE = {
  3:   [4, 6, 10, 14, 25, 40, 60, 100, 140, 250, 400, 600, 1000, 1400],
  6:   [5, 8, 12, 18, 30, 48, 75, 120, 180, 300, 480, 750, 1200, 1800],
  10:  [6, 9, 15, 22, 36, 58, 90, 150, 220, 360, 580, 900, 1500, 2200],
  18:  [8, 11, 18, 27, 43, 70, 110, 180, 270, 430, 700, 1100, 1800, 2700],
  30:  [9, 13, 21, 33, 52, 84, 130, 210, 330, 520, 840, 1300, 2100, 3300],
  50:  [11, 16, 25, 39, 62, 100, 160, 250, 390, 620, 1000, 1600, 2500, 3900],
  80:  [13, 19, 30, 46, 74, 120, 190, 300, 460, 740, 1200, 1900, 3000, 4600],
  120: [15, 22, 35, 54, 87, 140, 220, 350, 540, 870, 1400, 2200, 3500, 5400],
  180: [18, 25, 40, 63, 100, 160, 250, 400, 630, 1000, 1600, 2500, 4000, 6300],
  250: [20, 29, 46, 72, 115, 185, 290, 460, 720, 1150, 1850, 2900, 4600, 7200],
  315: [23, 32, 52, 81, 130, 210, 320, 520, 810, 1300, 2100, 3200, 5200, 8100],
  400: [25, 36, 57, 89, 140, 230, 360, 570, 890, 1400, 2300, 3600, 5700, 8900],
  500: [27, 40, 63, 97, 155, 250, 400, 630, 970, 1550, 2500, 4000, 6300, 9700]
};

var UPPER_LIMITS = [3, 6, 10, 18, 30, 50, 80, 120, 180, 250, 315, 400, 500];

// 取某公称尺寸、某等级的标准公差值（µm）
function itValue(nominal, grade) {
  if (!(nominal > 0) || nominal > 500) return null;
  for (var i = 0; i < UPPER_LIMITS.length; i++) {
    if (nominal <= UPPER_LIMITS[i]) {
      return IT_TABLE[UPPER_LIMITS[i]][grade - 5];
    }
  }
  return null;
}

// 所属尺寸分段的文字描述
function segmentText(nominal) {
  var lower = 0;
  for (var i = 0; i < UPPER_LIMITS.length; i++) {
    if (nominal <= UPPER_LIMITS[i]) {
      return lower === 0 ? &quot;≤ &quot; + UPPER_LIMITS[i] + &quot; mm&quot;
                         : &quot;> &quot; + lower + &quot; ~ &quot; + UPPER_LIMITS[i] + &quot; mm&quot;;
    }
    lower = UPPER_LIMITS[i];
  }
  return &quot;—&quot;;
}

// µm → mm 文字（0 直接写 0，其余保留 3 位小数）
function toMm(um) {
  if (um === 0) return &quot;0&quot;;
  return (um / 1000).toFixed(3);
}

function signed(um) {
  return (um > 0 ? &quot;+&quot; : &quot;&quot;) + toMm(um);
}

function row(label, value, big) {
  return '<div class=&quot;row' + (big ? &quot; big&quot; : &quot;&quot;) + '&quot;><span>' + label + '</span><span>' + value + &quot;</span></div>&quot;;
}

function readNumber(id) {
  var v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? null : v;
}

function readGrade(id) {
  return parseInt(document.getElementById(id).value, 10);
}

function calcSingle() {
  var out = document.getElementById(&quot;singleOut&quot;);
  var nominal = readNumber(&quot;nominal&quot;);
  var grade = readGrade(&quot;grade&quot;);
  var basis = document.getElementById(&quot;basis&quot;).value;
  var it = itValue(nominal, grade);

  if (it === null) {
    out.innerHTML = '<p class=&quot;note&quot;>公称尺寸请填 0.1 ~ 500 之间的数值。</p>';
    return;
  }

  var es, ei;
  if (basis === &quot;H&quot;) {
    ei = 0;
    es = it;
  } else {
    es = 0;
    ei = -it;
  }

  var code = (basis === &quot;H&quot; ? &quot;H&quot; : &quot;h&quot;) + grade;
  var anno = &quot;φ&quot; + nominal + code + &quot;(&quot; + signed(es) + &quot; / &quot; + signed(ei) + &quot;)&quot;;

  out.innerHTML =
    row(&quot;所属尺寸分段&quot;, segmentText(nominal)) +
    row(&quot;标准公差值 IT&quot; + grade, it + &quot; µm　=　&quot; + toMm(it) + &quot; mm&quot;, true) +
    row(&quot;公差带代号&quot;, basis === &quot;H&quot; ? &quot;孔 &quot; + code : &quot;轴 &quot; + code) +
    row(&quot;上偏差 es / ES&quot;, signed(es) + &quot; mm&quot;) +
    row(&quot;下偏差 ei / EI&quot;, signed(ei) + &quot; mm&quot;) +
    '<div class=&quot;row&quot;><span>标注写法</span><span><span class=&quot;anno&quot;>' + anno + &quot;</span></span></div>&quot;;
}

function calcFit() {
  var out = document.getElementById(&quot;fitOut&quot;);
  var nominal = readNumber(&quot;fitNominal&quot;);
  var gHole = readGrade(&quot;fitHole&quot;);
  var gShaft = readGrade(&quot;fitShaft&quot;);
  var itH = itValue(nominal, gHole);
  var itS = itValue(nominal, gShaft);

  if (itH === null || itS === null) {
    out.innerHTML = '<p class=&quot;note&quot;>公称尺寸请填 0.1 ~ 500 之间的数值。</p>';
    return;
  }

  // 孔 H：EI = 0，ES = +IT　｜　轴 h：es = 0，ei = -IT
  var ES = itH, EI = 0;
  var es = 0, ei = -itS;

  var xMax = ES - ei;   // 最大间隙（正数表示有间隙）
  var xMin = EI - es;   // 最小间隙（负数表示有过盈）

  var kind, kindColor = &quot;tag&quot;;
  if (xMin >= 0) {
    kind = &quot;间隙配合&quot;;
  } else if (xMax <= 0) {
    kind = &quot;过盈配合&quot;;
  } else {
    kind = &quot;过渡配合&quot;;
  }

  function gapText(um) {
    if (um >= 0) return &quot;间隙 &quot; + toMm(um) + &quot; mm&quot;;
    return &quot;过盈 &quot; + toMm(-um) + &quot; mm&quot;;
  }

  out.innerHTML =
    row(&quot;配合代号&quot;, &quot;φ&quot; + nominal + &quot; H&quot; + gHole + &quot;/h&quot; + gShaft, true) +
    row(&quot;孔的极限偏差&quot;, signed(ES) + &quot; / &quot; + signed(EI) + &quot; mm（IT&quot; + gHole + &quot; = &quot; + itH + &quot; µm）&quot;) +
    row(&quot;轴的极限偏差&quot;, signed(es) + &quot; / &quot; + signed(ei) + &quot; mm（IT&quot; + gShaft + &quot; = &quot; + itS + &quot; µm）&quot;) +
    row(&quot;最大间隙 / 最小过盈&quot;, gapText(xMax)) +
    row(&quot;最小间隙 / 最大过盈&quot;, gapText(xMin)) +
    row(&quot;配合公差&quot;, toMm(xMax - xMin) + &quot; mm&quot;) +
    '<div class=&quot;row&quot;><span>配合性质</span><span><span class=&quot;' + kindColor + '&quot;>' + kind + &quot;</span></span></div>&quot;;
}

// 初始化下拉框（IT5 ~ IT18）
(function init() {
  var options = &quot;&quot;;
  for (var g = 5; g <= 18; g++) {
    options += '<option value=&quot;' + g + '&quot;>IT' + g + &quot;</option>&quot;;
  }
  document.getElementById(&quot;grade&quot;).innerHTML = options;
  document.getElementById(&quot;fitHole&quot;).innerHTML = options;
  document.getElementById(&quot;fitShaft&quot;).innerHTML = options;
  document.getElementById(&quot;grade&quot;).value = &quot;7&quot;;
  document.getElementById(&quot;fitHole&quot;).value = &quot;7&quot;;
  document.getElementById(&quot;fitShaft&quot;).value = &quot;6&quot;;

  [&quot;nominal&quot;, &quot;grade&quot;, &quot;basis&quot;].forEach(function (id) {
    document.getElementById(id).addEventListener(&quot;input&quot;, calcSingle);
    document.getElementById(id).addEventListener(&quot;change&quot;, calcSingle);
  });
  [&quot;fitNominal&quot;, &quot;fitHole&quot;, &quot;fitShaft&quot;].forEach(function (id) {
    document.getElementById(id).addEventListener(&quot;input&quot;, calcFit);
    document.getElementById(id).addEventListener(&quot;change&quot;, calcFit);
  });

  calcSingle();
  calcFit();
})();
</script>
</body>

<body>
<div class=&quot;wrap&quot;>

  <div class=&quot;top&quot;>
    <h1>齿轮传动参数计算器</h1>
    
  </div>

  <div class=&quot;card&quot;>
    <h2>输入参数</h2>
    <p class=&quot;hint&quot;>一对外啮合标准直齿圆柱齿轮。模数按标准系列取（1、1.25、1.5、2、2.5、3、4、5…）。</p>

      </label>
      <label class=&quot;field&quot;>齿顶高系数 hₐ*
        <input id=&quot;ha&quot; type=&quot;number&quot; min=&quot;0.5&quot; max=&quot;1.2&quot; step=&quot;0.05&quot; value=&quot;1&quot; />
      </label>
      <label class=&quot;field&quot;>顶隙系数 c*
        <input id=&quot;c&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;0.5&quot; step=&quot;0.05&quot; value=&quot;0.25&quot; />
      </label>
      <label class=&quot;field&quot;>小齿轮转速 n₁（r/min，可留空）

      齿距 <code>p = πm</code>；圆周速度 <code>v = π·d·n / 60000</code>。<br />
      20° 标准直齿轮不发生根切的最少齿数是 17 齿；负载较大时一般取 z₁ ≥ 20~25。

<script>
function readNumber(id) {
  var v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? null : v;
}

function f(value, digits) {
  if (value === null || !isFinite(value)) return &quot;—&quot;;
  return value.toFixed(digits === undefined ? 3 : digits);
}

function calc() {
  var m = readNumber(&quot;module&quot;);
  var z1 = readNumber(&quot;z1&quot;);
  var z2 = readNumber(&quot;z2&quot;);
  var alpha = readNumber(&quot;alpha&quot;);
  var ha = readNumber(&quot;ha&quot;);
  var c = readNumber(&quot;c&quot;);
  var n1 = readNumber(&quot;n1&quot;);
  var out = document.getElementById(&quot;out&quot;);

  if (!(m > 0) || !(z1 >= 1) || !(z2 >= 1) || alpha === null || ha === null || c === null) {
    out.innerHTML = '<p class=&quot;note&quot;>请把模数、齿数、压力角填成正数。</p>';
    return;
  }

  var rad = (alpha * Math.PI) / 180;
  var ratio = z2 / z1;

  var d1 = m * z1, d2 = m * z2;
  var da1 = m * (z1 + 2 * ha), da2 = m * (z2 + 2 * ha);
  var df1 = m * (z1 - 2 * ha - 2 * c), df2 = m * (z2 - 2 * ha - 2 * c);
  var db1 = d1 * Math.cos(rad), db2 = d2 * Math.cos(rad);
  var a = (m * (z1 + z2)) / 2;
  var p = Math.PI * m;
  var h = m * (2 * ha + c);
  var v1 = n1 !== null &amp;&amp; n1 > 0 ? (Math.PI * d1 * n1) / 60000 : null;

  function tr(name, unit, v1v, v2v, digits) {

    tr(&quot;齿顶圆直径 dₐ&quot;, &quot;mm&quot;, da1, da2) +
    tr(&quot;齿根圆直径 d_f&quot;, &quot;mm&quot;, df1, df2) +
    tr(&quot;基圆直径 d_b&quot;, &quot;mm&quot;, db1, db2) +
    &quot;</tbody></table>&quot;;

  html +=
    '<table><tbody>' +
    '<tr><td>传动比 i = z₂ / z₁</td><td colspan=&quot;2&quot;>' + f(ratio, 4) + &quot;</td></tr>&quot; +
    '<tr><td>标准中心距 a</td><td colspan=&quot;2&quot;>' + f(a) + &quot; mm</td></tr>&quot; +
    '<tr><td>齿距 p = πm</td><td colspan=&quot;2&quot;>' + f(p) + &quot; mm</td></tr>&quot; +
    '<tr><td>全齿高 h</td><td colspan=&quot;2&quot;>' + f(h) + &quot; mm</td></tr>&quot; +
    '<tr><td>齿顶高 hₐ / 齿根高 h_f</td><td colspan=&quot;2&quot;>' + f(m * ha) + &quot; / &quot; + f(m * (ha + c)) + &quot; mm</td></tr>&quot; +
    '<tr><td>小齿轮圆周速度 v₁</td><td colspan=&quot;2&quot;>' + (v1 === null ? &quot;—（未填转速）&quot; : f(v1, 2) + &quot; m/s&quot;) + &quot;</td></tr>&quot; +
    '<tr><td>大齿轮转速 n₂</td><td colspan=&quot;2&quot;>' + (n2 === null ? &quot;—&quot; : f(n2, 1) + &quot; r/min&quot;) + &quot;</td></tr>&quot; +
    '</tbody></table>';

  if (z1 < 17) {
    html += '<p class=&quot;note&quot; style=&quot;margin-top:14px;color:#c2603a&quot;>提示：z₁ = ' + z1 +
      &quot; 小于 17 齿，标准直齿轮会有根切风险，一般需要变位。</p>&quot;;
  }

  out.innerHTML = html;
}

[&quot;module&quot;, &quot;z1&quot;, &quot;z2&quot;, &quot;alpha&quot;, &quot;ha&quot;, &quot;c&quot;, &quot;n1&quot;].forEach(function (id) {
  document.getElementById(id).addEventListener(&quot;input&quot;, calc);
  document.getElementById(id).addEventListener(&quot;change&quot;, calc);
});

</script>

    background-color: #eef7f2;
    background-image:
      linear-gradient(rgba(255,255,255,.62), rgba(255,255,255,.62)),
      radial-gradient(circle at 8% 10%, rgba(150,226,199,.9) 0%, transparent 45%),
      radial-gradient(circle at 92% 8%, rgba(186,213,255,.85) 0%, transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(255,205,226,.85) 0%, transparent 45%),
      radial-gradient(circle at 6% 88%, rgba(222,205,255,.8) 0%, transparent 45%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .top { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
  .top h1 { margin: 0; font-size: 22px; }
  .top a { color: #2fbfa8; text-decoration: none; font-size: 14px; }
  .top a:hover { text-decoration: underline; }
  .card {
    padding: 22px; margin-bottom: 18px;
    border: 1px solid rgba(255,255,255,.95); border-radius: 24px;
    background: rgba(255,255,255,.72);
    box-shadow: 0 10px 30px rgba(78,122,140,.13);
  }
  .card > h2 { margin: 0 0 4px; font-size: 16px; }
  .card > p.hint { margin: 0 0 18px; font-size: 13px; color: #5d6b76; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5d6b76; }
  input, select {
    width: 100%; padding: 9px 12px; font: inherit; font-size: 14px; color: #26313a;
    border: 1px solid rgba(120,150,165,.28); border-radius: 12px; background: #fff;
  }
  input:focus, select:focus { outline: 2px solid #2fbfa8; outline-offset: 1px; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; font-size: 14px; }
  .row + .row { border-top: 1px solid rgba(120,150,165,.14); }
  .row span:first-child { color: #5d6b76; }
  .row span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
  .big span:last-child { font-size: 18px; color: #1d8b7a; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
  th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid rgba(120,150,165,.16); }
  th { color: #5d6b76; font-weight: 600; font-size: 13px; }
  td:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums; }
  .note { font-size: 12.5px; color: #8b98a3; line-height: 1.7; }
  .note code { background: rgba(120,150,165,.14); padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<div class=&quot;wrap&quot;>

  <div class=&quot;top&quot;>
    <h1>材料理论重量计算器</h1>
    
  </div>

  <div class=&quot;card&quot;>
    <h2>输入参数</h2>
    <p class=&quot;hint&quot;>按外形尺寸算理论重量（不含加工余量和公差影响），用于备料估算。</p>

    <div class=&quot;grid&quot;>
      <label class=&quot;field&quot;>形状
        <select id=&quot;shape&quot;>
          <option value=&quot;round&quot;>圆钢 / 圆棒</option>
          <option value=&quot;square&quot;>方钢</option>
          <option value=&quot;plate&quot;>钢板</option>
          <option value=&quot;pipe&quot;>圆管</option>
          <option value=&quot;hex&quot;>六角棒（对边距）</option>
        </select>
      </label>
      <label class=&quot;field&quot;>材料
        <select id=&quot;material&quot;></select>
      </label>
      <label class=&quot;field&quot;>自定义密度（g/cm³，可留空）
        <input id=&quot;customDensity&quot; type=&quot;number&quot; min=&quot;0.1&quot; step=&quot;0.01&quot; placeholder=&quot;留空则用上面选的材料&quot; />
      </label>
    </div>

    <div class=&quot;grid&quot; style=&quot;margin-top:14px&quot;>
      <label class=&quot;field&quot; id=&quot;wrapA&quot;>直径 / 边长 / 厚度 a（mm）
        <input id=&quot;dima&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.1&quot; value=&quot;20&quot; />
      </label>
      <label class=&quot;field&quot; id=&quot;wrapB&quot; style=&quot;display:none&quot;>宽度 b（mm）
        <input id=&quot;dimb&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.1&quot; value=&quot;100&quot; />
      </label>
      <label class=&quot;field&quot; id=&quot;wrapC&quot; style=&quot;display:none&quot;>内径 / 内孔（mm）
        <input id=&quot;dimc&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.1&quot; value=&quot;10&quot; />
      </label>
      <label class=&quot;field&quot;>长度 / 高度 L（mm）
        <input id=&quot;length&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;1000&quot; />
      </label>
      <label class=&quot;field&quot;>件数
        <input id=&quot;count&quot; type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot; value=&quot;1&quot; />
      </label>
    </div>
  </div>

  <div class=&quot;card&quot;>
    <h2>计算结果</h2>
    <div id=&quot;out&quot;></div>
  </div>

  <div class=&quot;card&quot;>
    <h2>常用材料密度（g/cm³）</h2>
    <table>
      <thead><tr><th>材料</th><th>密度</th><th>材料</th><th>密度</th></tr></thead>
      <tbody id=&quot;densityTable&quot;></tbody>
    </table>
    <p class=&quot;note&quot; style=&quot;margin-top:14px&quot;>
      重量 = 体积 × 密度。密度取常见牌号的近似值，精确计算请按具体牌号或实测值填写&quot;自定义密度&quot;。<br />
      圆钢可按 <code>0.00617 × d²</code>（kg/m，d 单位 mm）快速估算。
    </p>
  </div>

</div>

<script>
// 材料密度表（g/cm³，常见牌号近似值）
var MATERIALS = [
  { name: &quot;碳素钢 / 低合金钢&quot;, density: 7.85 },
  { name: &quot;不锈钢（304/316）&quot;, density: 7.93 },
  { name: &quot;灰铸铁&quot;, density: 7.2 },
  { name: &quot;球墨铸铁&quot;, density: 7.3 },
  { name: &quot;铝合金&quot;, density: 2.7 },
  { name: &quot;纯铜&quot;, density: 8.96 },
  { name: &quot;黄铜&quot;, density: 8.5 },
  { name: &quot;钛合金（TC4）&quot;, density: 4.43 },
  { name: &quot;镁合金&quot;, density: 1.8 },
  { name: &quot;尼龙 PA6&quot;, density: 1.15 },
  { name: &quot;POM（赛钢）&quot;, density: 1.41 },
  { name: &quot;亚克力 PMMA&quot;, density: 1.19 }
];

var DENSITY_REF = [
  [&quot;碳素钢 / 低合金钢&quot;, &quot;7.85&quot;, &quot;纯铜&quot;, &quot;8.96&quot;],
  [&quot;不锈钢（304/316）&quot;, &quot;7.93&quot;, &quot;黄铜&quot;, &quot;8.50&quot;],
  [&quot;灰铸铁&quot;, &quot;7.20&quot;, &quot;钛合金（TC4）&quot;, &quot;4.43&quot;],
  [&quot;球墨铸铁&quot;, &quot;7.30&quot;, &quot;镁合金&quot;, &quot;1.80&quot;],
  [&quot;铝合金&quot;, &quot;2.70&quot;, &quot;尼龙 PA6&quot;, &quot;1.15&quot;],
  [&quot;工业纯铁&quot;, &quot;7.87&quot;, &quot;亚克力 PMMA&quot;, &quot;1.19&quot;]
];

function readNumber(id) {
  var v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? null : v;
}

function f(value, digits) {
  if (value === null || !isFinite(value)) return &quot;—&quot;;
  return value.toFixed(digits === undefined ? 3 : digits);
}

function syncFields() {
  var shape = document.getElementById(&quot;shape&quot;).value;
  // 只有钢板（厚×宽×长）、圆管（外径/内径）需要第二、第三个尺寸
  document.getElementById(&quot;wrapB&quot;).style.display = shape === &quot;plate&quot; ? &quot;&quot; : &quot;none&quot;;
  document.getElementById(&quot;wrapC&quot;).style.display = shape === &quot;pipe&quot; ? &quot;&quot; : &quot;none&quot;;

  var labelA = {
    round: &quot;直径 d（mm）&quot;,
    square: &quot;边长 a（mm）&quot;,
    plate: &quot;厚度 t（mm）&quot;,
    pipe: &quot;外径 D（mm）&quot;,
    hex: &quot;对边距 s（mm）&quot;
  }[shape];
  document.getElementById(&quot;wrapA&quot;).childNodes[0].nodeValue = labelA + &quot; &quot;;
}

function calc() {
  syncFields();

  var shape = document.getElementById(&quot;shape&quot;).value;
  var materialIndex = parseInt(document.getElementById(&quot;material&quot;).value, 10) || 0;
  var custom = readNumber(&quot;customDensity&quot;);
  var density = custom !== null &amp;&amp; custom > 0 ? custom : MATERIALS[materialIndex].density;

  var a = readNumber(&quot;dima&quot;);
  var b = readNumber(&quot;dimb&quot;);
  var c = readNumber(&quot;dimc&quot;);
  var L = readNumber(&quot;length&quot;);
  var count = readNumber(&quot;count&quot;);
  var out = document.getElementById(&quot;out&quot;);

  if (!(a > 0) || !(L > 0)) {
    out.innerHTML = '<p class=&quot;note&quot;>尺寸请填正数。</p>';
    return;
  }
  if (shape === &quot;plate&quot; &amp;&amp; !(b > 0)) {
    out.innerHTML = '<p class=&quot;note&quot;>钢板需要填宽度 b。</p>';
    return;
  }
  if (shape === &quot;pipe&quot; &amp;&amp; !(c >= 0 &amp;&amp; c < a)) {
    out.innerHTML = '<p class=&quot;note&quot;>圆管的内径要小于外径。</p>';
    return;
  }

  // 截面积（mm²）
  var area;
  if (shape === &quot;round&quot;) area = (Math.PI / 4) * a * a;
  else if (shape === &quot;square&quot;) area = a * a;
  else if (shape === &quot;plate&quot;) area = a * b;
  else if (shape === &quot;pipe&quot;) area = (Math.PI / 4) * (a * a - c * c);
  else area = (Math.sqrt(3) / 2) * a * a; // 六角棒：对边距 s → 面积 = √3/2 · s²

  var volumeMm3 = area * L;
  var volumeCm3 = volumeMm3 / 1000;
  var weightPerPiece = (volumeCm3 * density) / 1000; // kg
  var pieces = count !== null &amp;&amp; count >= 1 ? Math.round(count) : 1;
  var total = weightPerPiece * pieces;
  var perMeter = (weightPerPiece * 1000) / L;

  function row(label, value, big) {
    return '<div class=&quot;row' + (big ? &quot; big&quot; : &quot;&quot;) + '&quot;><span>' + label + '</span><span>' + value + &quot;</span></div>&quot;;
  }

  out.innerHTML =
    row(&quot;材料 / 密度&quot;, MATERIALS[materialIndex].name.replace(/\s*\/.*/, &quot;&quot;) + &quot;　&quot; + f(density, 2) + &quot; g/cm³&quot;) +
    row(&quot;截面积&quot;, f(area, 2) + &quot; mm²&quot;) +
    row(&quot;体积&quot;, f(volumeCm3, 2) + &quot; cm³&quot;) +
    row(&quot;每米重量&quot;, f(perMeter, 3) + &quot; kg/m&quot;) +
    row(&quot;单件重量&quot;, f(weightPerPiece, 3) + &quot; kg&quot;, true) +
    (pieces > 1 ? row(&quot;合计（&quot; + pieces + &quot; 件）&quot;, f(total, 3) + &quot; kg&quot;, true) : &quot;&quot;);
}

(function init() {
  var options = MATERIALS.map(function (m, i) {
    return '<option value=&quot;' + i + '&quot;>' + m.name + &quot;　&quot; + m.density + &quot;</option>&quot;;
  }).join(&quot;&quot;);
  document.getElementById(&quot;material&quot;).innerHTML = options;

  document.getElementById(&quot;densityTable&quot;).innerHTML = DENSITY_REF.map(function (r) {
    return &quot;<tr><td>&quot; + r[0] + &quot;</td><td>&quot; + r[1] + &quot;</td><td>&quot; + r[2] + &quot;</td><td>&quot; + r[3] + &quot;</td></tr>&quot;;
  }).join(&quot;&quot;);

  [&quot;shape&quot;, &quot;material&quot;, &quot;customDensity&quot;, &quot;dima&quot;, &quot;dimb&quot;, &quot;dimc&quot;, &quot;length&quot;, &quot;count&quot;].forEach(function (id) {
    document.getElementById(id).addEventListener(&quot;input&quot;, calc);
    document.getElementById(id).addEventListener(&quot;change&quot;, calc);
  });

  calc();
})();
</script>
</body>
</html>
"></iframe>
</div>


  <style>
    .view { display: none; }
    .view.is-active { display: block; }
    .view > .bento[data-view] { display: none; }
    .view.is-active > .bento[data-view] { display: grid; }
    .view-tool .back-home { display: inline-block; margin: 0 0 14px; color: #2fbfa8; text-decoration: none; font-size: 14px; }
    .view-tool.is-active { display: block; }
    .tool-frame { width: 100%; height: 92vh; border: 0; border-radius: 24px; background: #eef7f2; }
  </style>
  <script>
  (function () {
    var MAP = {
      "index.html": "home", "": "home", "./": "home",
      "blog.html": "blog", "projects.html": "projects", "about.html": "about",
      "share.html": "share", "bloggers.html": "bloggers",
      "tools/tolerance.html": "tool-tolerance",
      "tools/gear.html": "tool-gear",
      "tools/material.html": "tool-material"
    };
    function currentView() {
      var m = /^#\/(.+)$/.exec(location.hash || "");
      return m ? m[1] : "home";
    }
    function show(name) {
      var views = document.querySelectorAll("[data-view]");
      for (var i = 0; i < views.length; i++) {
        var on = views[i].getAttribute("data-view") === name;
        views[i].classList.toggle("is-active", on);
      }
      document.body.setAttribute("data-page", name);
      window.scrollTo(0, 0);
      if (window.SiteCore) {
        SiteCore.renderProfile();
        SiteCore.renderPages();
        SiteCore.renderHomeCards();
      }
    }
    document.addEventListener("click", function (e) {
      var node = e.target;
      while (node && node.tagName !== "A") node = node.parentNode;
      if (!node) return;
      var href = (node.getAttribute("href") || "").replace(/^\.\//, "");
      if (MAP[href]) {
        e.preventDefault();
        location.hash = "#/" + MAP[href];
      }
    });
    window.addEventListener("hashchange", function () { show(currentView()); });

    // 等主脚本把数据加载完再切视图
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () { show(currentView()); });
    } else {
      show(currentView());
    }
  })();
  </script>

</body>
